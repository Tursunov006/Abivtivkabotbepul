name: Keep Render Awake 24/7

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          curl -s -L -A "Mozilla/5.0 KeepAlive" https://abivtivkabotbepul.onrender.com/health || true
          curl -s -L -A "Mozilla/5.0 KeepAlive" https://abivtivkabotbepul.onrender.com/ > /dev/null || true
          echo "Pinged Render server successfully at $(date)"
